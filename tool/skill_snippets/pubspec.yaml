name: skill_snippets
description: Compiles the Dart snippets of the package skills and READMEs against the workspace.

publish_to: 'none'

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  iceberg: 0.2.1
  logging: ^1.3.0
  postgrest: 3.0.0-dev.12
  supabase: 3.0.0-dev.12
  supabase_flutter: 3.0.0-dev.12
  supabase_flutter_web_auth: 0.1.10
  supabase_functions: 3.0.0-dev.9
  supabase_test: 0.5.2
  supabase_typegen: 0.6.0
  yet_another_json_isolate: 3.0.0-dev.2
  test: ^1.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
