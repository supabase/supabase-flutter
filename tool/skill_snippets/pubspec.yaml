publish_to: 'none'

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  logging: ^1.3.0
  passkeys: ^2.23.1
  postgrest: 3.0.0-dev.12
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.0
  supabase: 3.0.0-dev.12
  supabase_flutter: 3.0.0-dev.12
  supabase_test: 0.5.2
  test: ^1.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
