    sdk: flutter
  logging: ^1.3.0
  postgrest: 3.0.0-dev.12
  supabase: 3.0.0-dev.12
  supabase_flutter: 3.0.0-dev.12
  supabase_test: 0.5.2
  test: ^1.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
