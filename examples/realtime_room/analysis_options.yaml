include: package:supabase_lints/analysis_options_flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The typed table API (`client.table(...)`) that this example is built on
    # is marked experimental while it settles.
    experimental_member_use: ignore
