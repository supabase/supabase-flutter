# Shared lint configuration for the Supabase Dart packages.
#
# The 'recommended' DCM preset is enabled, but the rules listed below currently
# have violations in the existing codebase and are disabled for now. They are
# meant to be re-enabled one by one as the violations get fixed (ratcheting),
# so new code is not held to a rule the rest of the codebase does not yet pass.
include: package:lints/recommended.yaml

analyzer:
  # These exclusions are repeated verbatim in every package's own
  # analysis_options.yaml. The duplication is deliberate: flutter_tools rewrites
  # each project's file to re-add them on every `flutter pub get`, because its
  # AnalysisOptionsMigration does not resolve `include:` and so cannot see that
  # they are already inherited from here. Committing the duplicates keeps the
  # working tree clean. Drop them once the upstream issue is fixed:
  # https://github.com/flutter/flutter/issues/191056
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-raw-types: true

linter:
  rules:
    unawaited_futures: true
    discarded_futures: true
    use_enums: true
    unnecessary_breaks: true
    lines_longer_than_80_chars: true

formatter:
  trailing_commas: preserve

dcm:
  extends:
    - recommended
  rules:
    prefer-switch-expression: true
    # Keep web and WASM support: dart:html / dart:js / dart:js_util work on the
    # JS web target but break WASM, and dart:io / dart:ffi break both. The web
    # interop libraries below are replaced by dart:js_interop + package:web, and
    # dart:io is only allowed in conditional `_io.dart` files.
    avoid-banned-imports:
      entries:
        - paths: ['.*/lib/.*\.dart$']
          deny: ['^dart:html$', '^dart:js$', '^dart:js_util$']
          message: Use dart:js_interop with package:web for WASM compatibility.
          severity: error
        - paths: ['.*/lib/.*\.dart$']
          deny: ['^dart:ffi$']
          message: dart:ffi is not available on web or WASM.
          severity: error
        - paths: ['.*/lib/.*\.dart$']
          exclude-paths: ['.*_io\.dart$']
          deny: ['^dart:io$']
          message: Import dart:io only in conditional `_io.dart` files; use defaultTargetPlatform or conditional imports elsewhere.
          severity: error
    avoid-accessing-collections-by-constant-index: false
    avoid-duplicate-initializers: false
    avoid-duplicate-test-assertions: false
    avoid-dynamic: false
    avoid-nullable-interpolation: false
    avoid-throw-in-catch-block: false
    avoid-unassigned-stream-subscriptions: false
    avoid-unsafe-collection-methods: false
    avoid-unused-parameters: false
    move-variable-closer-to-its-usage: false
    no-empty-block: false
    prefer-match-file-name: false
    prefer-switch-with-enums: false

    # Blocked until dot shorthands stabilize. They are still an experimental
    # language feature, so code targeting our 3.9.0 floor cannot use them.
    prefer-returning-shorthands: false # needs dot shorthands (experimental)
    prefer-shorthands-with-enums: false # needs dot shorthands (experimental)
    prefer-shorthands-with-static-fields: false # needs dot shorthands (experimental)
    prefer-shorthands-with-constructors: false # needs dot shorthands (experimental)

    # Off for good, not part of the ratchet above. Each one asks for a
    # convention this SDK deliberately does not follow, so there is nothing
    # left to fix.

    # Wants every field of a Function type to be named `on*`/`*Builder`, and
    # every field named that way to be a Function. Our Function-typed fields
    # are collaborators rather than event callbacks (RealtimeClient.transport,
    # .encode, .decode, .logger, RetryTimer.timerCalc), and the fields that do
    # read as callbacks are the cross-SDK names we must keep
    # (AuthClient.onAuthStateChange is a Stream, not a Function).
    prefer-correct-callback-field-name: false

    # Wants a subclass that adds a field to reimplement `==` and `hashCode`
    # over it. The three classes it flags add a field to an exception or a
    # response, where value equality is not a use case we serve, and the two
    # auth ones would compare by reference anyway: `originalError` only ever
    # holds an `http.Response` or a `FormatException`, neither of which
    # implements `==`.
    prefer-overriding-parent-equality: false

    # Wants the Flutter `k` prefix on global constants. The Dart style guide
    # asks for plain lowerCamelCase instead, and a one-letter prefix also runs
    # against our own no-abbreviations rule.
    prefer-prefixed-global-constants: false

    # Almost every bare `Function` we declare is forced by the `Future`
    # interface we implement (`PostgrestBuilder.catchError(Function onError)`,
    # `then({Function? onError})`), where an explicit type would no longer
    # match the overridden signature.
    prefer-explicit-function-type: false
