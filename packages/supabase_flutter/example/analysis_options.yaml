include: package:supabase_lints/analysis_options_flutter.yaml

analyzer:
  exclude:
    - lib/generated_plugin_registrant.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # The typed table API (`client.table(...)`) that this example is built on
    # is marked experimental while it settles.
    experimental_member_use: ignore

dcm:
  rules:
    # This is a single-file demo app, so keeping every widget in one file is
    # intentional.
    - prefer-single-widget-per-file: false
