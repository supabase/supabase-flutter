name: Minimum SDK

on:
  push:
    branches:
      - main
    paths:
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/minimum-sdk.yml'
  pull_request:
    paths:
      - '**/pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/minimum-sdk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve on the minimum SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the minimum SDK versions
        id: minimum
        run: |
          set -euo pipefail
          flutter=$(sed -nE "s/^  flutter: '>=([0-9.]+)'$/\1/p" packages/supabase_flutter/pubspec.yaml)
          dart=$(sed -nE "s/^  sdk: '>=([0-9.]+) .*$/\1/p" pubspec.yaml)
          if [ -z "$flutter" ] || [ -z "$dart" ]; then
            echo "::error::Could not read the minimum Flutter and Dart versions."
            exit 1
          fi
          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "dart=$dart" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.minimum.outputs.flutter }}
          channel: 'stable'
          cache: true

      - name: Check that the minimum Flutter ships the minimum Dart
        env:
          MINIMUM_DART: ${{ steps.minimum.outputs.dart }}
          MINIMUM_FLUTTER: ${{ steps.minimum.outputs.flutter }}
        run: |
          set -euo pipefail
          bundled=$(dart --version 2>&1 | sed -nE 's/^Dart SDK version: ([0-9.]+).*$/\1/p')
          if [ "$bundled" != "$MINIMUM_DART" ]; then
            echo "::error::Flutter $MINIMUM_FLUTTER ships Dart $bundled," \
              "but the minimum Dart SDK is $MINIMUM_DART. Raise both floors together."
            exit 1
          fi

      # Ignores pubspec.lock, which CI resolves on a newer SDK, and checks that
      # the constraints in the pubspecs still have a solution on the minimum SDK.
      - name: Resolve dependencies
        id: resolve
        run: dart pub upgrade --dry-run

      - name: Close a Dependabot bump that raises the minimum SDK
        if: >-
          failure()
          && steps.resolve.outcome == 'failure'
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.html_url }}
          MINIMUM_DART: ${{ steps.minimum.outputs.dart }}
          MINIMUM_FLUTTER: ${{ steps.minimum.outputs.flutter }}
        run: |
          message="Closing, this bump does not resolve on Flutter $MINIMUM_FLUTTER"
          message+=" and Dart $MINIMUM_DART, the minimum SDK versions the packages"
          message+=" support. See the Minimum SDK workflow run for details."
          gh pr close "$PULL_REQUEST" --comment "$message"
