name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@9e71603c5d8410255493d264738e5c5f64251735 # capability-matrix-v1.12.0
    secrets:
      client-id: ${{ vars.GH_APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
