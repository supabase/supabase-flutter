name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@b0eececd661e56913d95a442e6ae65d6584991eb # capability-matrix/v1.17.0
    secrets:
      client-id: ${{ vars.GH_APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
