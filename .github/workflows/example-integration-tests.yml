# Runs on release pull requests, and on any pull request labelled
# "integration tests" so the suite can be exercised on demand.
name: Example integration tests

on:
  pull_request:
    # No "edited": a bot rewriting the description would otherwise cancel and
    # restart the whole matrix. Release pull requests are opened with their
    # title, and any other one can opt in with the label.
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SUPABASE_CLI_VERSION: 3.0.0
  CLOUDFLARED_VERSION: 2026.9.0
  # The SHA-256 of that version's cloudflared-linux-amd64, as listed in its
  # release notes. Update the two together.
  CLOUDFLARED_SHA256: 53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134

jobs:
  backend:
    name: Host shared Supabase
    if: >-
      startsWith(github.event.pull_request.title, 'chore(release)')
      || contains(github.event.pull_request.labels.*.name, 'integration tests')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_IDS: linux web android macos ios windows
    steps:
      # The stack keeps the CLI default ports (54320 to 54329) because the
      # example READMEs document them, but they sit in Linux's ephemeral port
      # range. Reserve them before anything opens a connection, so no outgoing
      # connection can be assigned one as its local port and block the bind.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # The tunnel below makes the stack public, so it must not accept the
      # well-known keys every local stack starts with. The CLI reads these
      # overrides in every later step, and the masks keep the secrets out of
      # the public log, where `supabase start` prints them.
      - name: Generate the credentials for this run
        run: |
          set -euo pipefail
          jwt_secret=$(openssl rand -hex 32)
          secret_key="sb_secret_$(openssl rand -hex 16)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$secret_key"
          # Without a signing key of its own the stack trusts the CLI's
          # published default one, which anyone can sign a service_role
          # token with.
          signing_keys="$RUNNER_TEMP/signing_keys.json"
          supabase gen signing-key --algorithm ES256 --workdir examples \
            | jq -s . > "$signing_keys"
          {
            echo "SUPABASE_AUTH_JWT_SECRET=$jwt_secret"
            echo "SUPABASE_AUTH_SECRET_KEY=$secret_key"
            echo "SUPABASE_AUTH_PUBLISHABLE_KEY=sb_publishable_$(openssl rand -hex 16)"
            echo "SUPABASE_AUTH_SIGNING_KEYS_PATH=$signing_keys"
            # Its access keys are fixed defaults that the config cannot
            # change, and no example uses it.
            echo "SUPABASE_STORAGE_S3_PROTOCOL_ENABLED=false"
            # Studio brings pg-meta, which runs any SQL sent to /pg/ without
            # a key, so keep both off even if the config turns them on.
            echo "SUPABASE_STUDIO_ENABLED=false"
            echo "SUPABASE_ANALYTICS_ENABLED=false"
          } >> "$GITHUB_ENV"

      - name: Start Supabase
        run: |
          set -euo pipefail
          supabase start --workdir examples

          # An override the CLI stops reading would quietly bring the default
          # keys back.
          status=$(supabase status -o json --workdir examples)
          echo "::add-mask::$(jq -r .SERVICE_ROLE_KEY <<< "$status")"
          jq -e --arg jwt_secret "$SUPABASE_AUTH_JWT_SECRET" \
            --arg secret_key "$SUPABASE_AUTH_SECRET_KEY" \
            --arg publishable_key "$SUPABASE_AUTH_PUBLISHABLE_KEY" \
            '.JWT_SECRET == $jwt_secret and .SECRET_KEY == $secret_key
              and .PUBLISHABLE_KEY == $publishable_key' \
            <<< "$status" > /dev/null \
            || { echo "::error::Supabase ignored the generated keys."; exit 1; }
          kid=$(jq -r '.[0].kid' "$SUPABASE_AUTH_SIGNING_KEYS_PATH")
          jwks_url="$(jq -r .API_URL <<< "$status")/auth/v1/.well-known/jwks.json"
          curl -fsS "$jwks_url" \
            | jq -e --arg kid "$kid" '[.keys[].kid] == [$kid]' > /dev/null \
            || { echo "::error::Supabase ignored the generated signing key."; exit 1; }

      - name: Install cloudflared
        run: |
          set -euo pipefail
          # Pinned: this suite only runs on release pull requests, which is the
          # worst place to discover that a new cloudflared behaves differently.
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64" \
            -o "$RUNNER_TEMP/cloudflared"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      - name: Expose Supabase through a tunnel
        id: tunnel
        env:
          # Fixed so the metrics server below has a known address; cloudflared
          # otherwise picks a free port on loopback.
          METRICS_ADDRESS: 127.0.0.1:20241
        run: |
          set -euo pipefail
          api_url=$(supabase status -o json --workdir examples | jq -r .API_URL)
          key=$SUPABASE_AUTH_PUBLISHABLE_KEY

          cloudflared tunnel --no-autoupdate --url "$api_url" \
            --metrics "$METRICS_ADDRESS" > cloudflared.log 2>&1 &
          tunnel_process=$!

          # Ask cloudflared for the hostname it was assigned instead of reading
          # it back out of its log: /ready turns 200 once a connection to the
          # edge is up, and /quicktunnel then answers {"hostname": "..."}.
          public_hostname=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$tunnel_process" 2>/dev/null; then
              break
            fi
            # No -S: a 503 here is the normal answer while it connects.
            if curl -fs -o /dev/null "http://$METRICS_ADDRESS/ready"; then
              public_hostname=$(curl -fsS "http://$METRICS_ADDRESS/quicktunnel" \
                | jq -r '.hostname // empty' || true)
              if [ -n "$public_hostname" ]; then
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$public_hostname" ]; then
            echo "Failed to open a cloudflared tunnel." >&2
            cat cloudflared.log >&2
            exit 1
          fi
          public_url="https://$public_hostname"

          # The tunnel answering is not the same as it reaching Supabase, and a
          # url that resolves but serves something else turns into six confusing
          # test failures three quarters of an hour from now.
          status=""
          for _ in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "apikey: $key" "$public_url/rest/v1/" || true)
            case "$status" in
              2??) break ;;
            esac
            sleep 2
          done
          case "$status" in
            2??) ;;
            *)
              echo "The tunnel at $public_url answered $status rather than serving Supabase." >&2
              cat cloudflared.log >&2
              exit 1
              ;;
          esac
          echo "Supabase is reachable at $public_url"

          mkdir -p endpoint
          jq -n --arg url "$public_url" --arg key "$key" '{url: $url, key: $key}' \
            > endpoint/endpoint.json

      - name: Publish Supabase endpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-endpoint-${{ github.run_attempt }}
          path: endpoint/endpoint.json
          retention-days: 1

      - name: Wait for the test jobs to finish
        run: |
          set -euo pipefail
          # Only the test jobs this attempt runs: a rerun of the failed jobs
          # must neither count nor wait for the ones an earlier attempt ran.
          jobs_url="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs"
          deadline=$(( $(date +%s) + 2700 ))
          while :; do
            jobs=$(gh api "$jobs_url" --paginate \
              -q '.jobs[] | select(.run_attempt == ${{ github.run_attempt }}) | "\(.name) \(.status) \(.conclusion)"')
            pending=""
            failed=""
            for id in $TARGET_IDS; do
              line=$(echo "$jobs" | awk -v id="$id" '$1 == id')
              if [ -z "$line" ]; then
                # The first attempt runs every test job, so one that is not
                # listed yet is still to come.
                if [ "${{ github.run_attempt }}" = 1 ]; then
                  pending="$pending $id"
                fi
                continue
              fi
              read -r _ status conclusion <<< "$line"
              if [ "$status" != completed ]; then
                pending="$pending $id"
              elif [ "$conclusion" != success ]; then
                failed="$failed $id"
              fi
            done
            if [ -z "$pending" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for:$pending"
              exit 1
            fi
            echo "Still waiting for:$pending"
            sleep 15
          done
          # Failing with the tests makes "Re-run failed jobs" start a new
          # backend for them, which they cannot run without.
          if [ -n "$failed" ]; then
            echo "::error::Test jobs failed:$failed"
            exit 1
          fi
          echo "All test jobs passed."

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup --workdir examples || true

  test:
    name: ${{ matrix.id }}
    if: >-
      startsWith(github.event.pull_request.title, 'chore(release)')
      || contains(github.event.pull_request.labels.*.name, 'integration tests')
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux, os: ubuntu-latest, target: linux }
          - { id: web, os: ubuntu-latest, target: web }
          - { id: android, os: ubuntu-latest, target: android }
          - { id: macos, os: blacksmith-6vcpu-macos-latest, target: macos }
          - { id: ios, os: blacksmith-6vcpu-macos-latest, target: ios }
          - { id: windows, os: windows-latest, target: windows }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb

      - name: Enable KVM
        if: matrix.target == 'android'
        run: |
          # Without access to /dev/kvm the emulator falls back to software
          # emulation, which takes minutes to boot and then stops responding.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot iOS simulator
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          # Erases first: the tests hang waiting for the app's VM service on a
          # simulator carrying state from the runner image. Then boots and waits
          # for the boot to finish, so the tests cannot launch into a simulator
          # that is still coming up.
          xcrun simctl shutdown all || true
          xcrun simctl erase "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_DEVICE=$udid" >> "$GITHUB_ENV"

      - name: Wait for the Supabase endpoint
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            if gh run download "${{ github.run_id }}" -n "supabase-endpoint-${{ github.run_attempt }}" -D endpoint; then
              break
            fi
            echo "Waiting for the Supabase endpoint..."
            sleep 10
          done
          test -f endpoint/endpoint.json
          {
            echo "SUPABASE_URL=$(jq -r .url endpoint/endpoint.json)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(jq -r .key endpoint/endpoint.json)"
          } >> "$GITHUB_ENV"

      - name: Scaffold platform and get dependencies
        shell: bash
        run: |
          set -euo pipefail
          for example in database_crud passkeys; do
            (cd "examples/$example" \
              && flutter create --platforms=${{ matrix.target }} . \
              && flutter pub get)
          done

      - name: Prepare the scaffolded macOS apps
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # The scaffolding only grants the sandbox the network server
          # entitlement, so without the client one every request to Supabase
          # fails with "Operation not permitted".
          for example in database_crud passkeys; do
            for config in DebugProfile Release; do
              /usr/libexec/PlistBuddy \
                -c 'Add :com.apple.security.network.client bool true' \
                "examples/$example/macos/Runner/$config.entitlements"
            done
          done
          # The passkeys plugin is only available from macOS 13.5, so the
          # scaffolded 10.15 target fails to compile the plugin registrant.
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 13.5;/g' \
            examples/passkeys/macos/Runner.xcodeproj/project.pbxproj

      - name: Prepare the scaffolded iOS apps
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          # As above, the passkeys plugin needs iOS 16 rather than the
          # scaffolded 13.0.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' \
            examples/passkeys/ios/Runner.xcodeproj/project.pbxproj

      - name: Run integration tests
        if: matrix.target != 'android'
        shell: bash
        run: dart .github/scripts/run_example_integration_tests.dart ${{ matrix.target }}

      - name: Run integration tests (Android emulator)
        if: matrix.target == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: dart .github/scripts/run_example_integration_tests.dart android

      - name: Dump the simulator log
        if: always() && matrix.target == 'ios'
        continue-on-error: true
        run: |
          xcrun simctl spawn "$IOS_DEVICE" log show --last 20m --style compact \
            --predicate 'processImagePath ENDSWITH "Runner"' | tail -n 300
