name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected packages
    runs-on: ubuntu-latest
    outputs:
      dart-matrix: ${{ steps.detect.outputs.dart-matrix }}
      channel-matrix: ${{ steps.detect.outputs.channel-matrix }}
      flutter: ${{ steps.detect.outputs.flutter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Detect affected packages
        id: detect
        run: |
          set -euo pipefail

          dart pub global activate melos

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          FORCE_ALL=false
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FORCE_ALL=true
          elif git diff --name-only "$BASE...HEAD" \
              | grep -qE '^(\.github/workflows/test\.yml|pubspec\.yaml|pubspec\.lock|supabase/)'; then
            FORCE_ALL=true
          fi

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Running all packages."
            CHANGED=$(melos list --json | jq -r '.[].name')
          else
            CHANGED=$(melos list --json --diff="$BASE...HEAD" --include-dependents | jq -r '.[].name')
          fi

          echo "Affected packages:"
          echo "$CHANGED"

          DART_PACKAGES="iceberg postgrest supabase_auth supabase_common supabase_dart supabase_functions supabase_realtime supabase_storage supabase_typegen yet_another_json_isolate"

          entries=()
          for package in $DART_PACKAGES; do
            if ! echo "$CHANGED" | grep -qx "$package"; then
              continue
            fi
            case "$package" in
              postgrest|supabase_auth|supabase_dart|supabase_realtime|supabase_storage) backend=true ;;
              *) backend=false ;;
            esac
            case "$package" in
              postgrest|supabase_auth|supabase_dart|supabase_realtime|supabase_storage) concurrency="1" ;;
              *) concurrency="0" ;;
            esac
            entries+=("{\"name\":\"$package\",\"backend\":$backend,\"concurrency\":\"$concurrency\"}")
          done

          if [ "${#entries[@]}" -eq 0 ]; then
            DART_MATRIX="[]"
          else
            DART_MATRIX="[$(IFS=,; echo "${entries[*]}")]"
          fi
          echo "dart-matrix=$DART_MATRIX" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'channel-matrix=["stable","beta","master"]' >> "$GITHUB_OUTPUT"
          else
            echo 'channel-matrix=["stable"]' >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qx "supabase_flutter"; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  test-dart:
    name: Dart ${{ matrix.package.name }} (${{ matrix.channel }})
    needs: changes
    if: ${{ needs.changes.outputs.dart-matrix != '[]' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.dart-matrix) }}
        channel: ${{ fromJSON(needs.changes.outputs.channel-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Format
        if: ${{ matrix.channel == 'stable' }}
        working-directory: packages/${{ matrix.package.name }}
        run: dart format lib test -l 80 --set-exit-if-changed

      - name: Analyze
        if: ${{ matrix.channel == 'stable' }}
        working-directory: packages/${{ matrix.package.name }}
        run: dart analyze --fatal-infos .

      - name: Setup Supabase CLI
        if: ${{ matrix.package.backend }}
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Print Supabase CLI version
        if: ${{ matrix.package.backend }}
        id: supabase-cli
        run: |
          version="$(supabase --version)"
          echo "Supabase CLI version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Supabase Docker images
        if: ${{ matrix.package.backend }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: supabase-images
        with:
          path: /tmp/supabase-images
          key: supabase-images-${{ steps.supabase-cli.outputs.version }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase Docker images
        if: ${{ matrix.package.backend && steps.supabase-images.outputs.cache-hit == 'true' }}
        run: |
          for image in /tmp/supabase-images/*.tar; do
            [ -f "$image" ] && docker load -i "$image"
          done

      - name: Start Supabase
        if: ${{ matrix.package.backend }}
        run: supabase start

      - name: Save Supabase Docker images to cache
        if: ${{ matrix.package.backend && steps.supabase-images.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p /tmp/supabase-images
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E 'supabase|postgrest|gotrue|storage-api|imgproxy|kong|realtime' \
            | while read -r image; do
                file=$(echo "$image" | tr '/:' '__')
                docker save "$image" -o "/tmp/supabase-images/${file}.tar"
              done

      - name: Run tests
        working-directory: packages/${{ matrix.package.name }}
        run: |
          CONCURRENCY=""
          if [ "${{ matrix.package.concurrency }}" = "1" ]; then
            CONCURRENCY="--concurrency=1"
          fi
          if [ "${{ matrix.channel }}" = "stable" ]; then
            dart pub global activate coverage
            dart test $CONCURRENCY --coverage=coverage
            dart pub global run coverage:format_coverage \
              --packages=../../.dart_tool/package_config.json \
              --report-on=lib --lcov -o coverage/lcov.info -i coverage
          else
            dart test $CONCURRENCY
          fi

      - name: Upload coverage to Coveralls
        if: ${{ matrix.channel == 'stable' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
          flag-name: ${{ matrix.package.name }}
          path-to-lcov: packages/${{ matrix.package.name }}/coverage/lcov.info
          fail-on-error: false

      - name: Dump Supabase logs on failure
        if: ${{ matrix.package.backend && failure() }}
        run: |
          supabase status || true
          docker ps -a
          docker logs supabase_db_supabase-flutter --tail 100 2>&1 || true
          docker logs supabase_auth_supabase-flutter --tail 100 2>&1 || true
          docker logs supabase_realtime_supabase-flutter --tail 100 2>&1 || true
          docker logs supabase_storage_supabase-flutter --tail 100 2>&1 || true

      - name: Stop Supabase
        if: ${{ matrix.package.backend && always() }}
        run: supabase stop --no-backup

  test-flutter:
    name: Flutter ${{ matrix.flutter-version == 'latest' && 'Latest' || format('v{0}', matrix.flutter-version) }} on ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flutter-version: ['3.35.x', 'latest']
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-latest
          - os: windows-latest
            runner: windows-latest

    defaults:
      run:
        working-directory: packages/supabase_flutter

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version != 'latest' && matrix.flutter-version || '' }}
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Bootstrap workspace
        run: |
          cd ../../
          dart pub global activate melos
          melos bootstrap

      - name: Run formatter
        if: ${{ matrix.flutter-version == 'latest'}}
        run: dart format lib test -l 80 --set-exit-if-changed

      - name: Run analyzer
        if: ${{ matrix.flutter-version == 'latest'}}
        run: flutter analyze .

      - name: Run unit tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.flutter-version }}" = "latest" ]; then
            flutter test --concurrency=1 --coverage
          else
            flutter test --concurrency=1
          fi

      - name: Upload coverage to Coveralls
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.flutter-version == 'latest' }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
          flag-name: supabase_flutter
          path-to-lcov: packages/supabase_flutter/coverage/lcov.info
          fail-on-error: false

      - name: Test web (JS)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.flutter-version == 'latest'}}
        run: flutter test --platform chrome

  dcm:
    name: DCM
    needs: changes
    if: ${{ needs.changes.outputs.dart-matrix != '[]' || needs.changes.outputs.flutter == 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap workspace
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Install DCM
        uses: CQLabs/setup-dcm@87040f30822ed86d362425d3dfadc9866baaa03f # v2.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run DCM
        run: dcm analyze --ci-key="${{ secrets.DCM_CI_KEY }}" --email="${{ secrets.DCM_EMAIL }}" packages

  coverage-finished:
    name: Finish coverage
    needs: [changes, test-dart, test-flutter]
    if: ${{ always() && (needs.changes.outputs.dart-matrix != '[]' || needs.changes.outputs.flutter == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel coverage build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: 'iceberg,postgrest,supabase_auth,supabase_common,supabase_dart,supabase_functions,supabase_realtime,supabase_storage,supabase_typegen,yet_another_json_isolate,supabase_flutter'
          fail-on-error: false

  test-result:
    name: Test result
    needs: [changes, test-dart, test-flutter, dcm]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
