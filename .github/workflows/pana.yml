name: Pana

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.title && '-body-edit' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect packages to score
    if: ${{ github.event.action != 'edited' || github.event.changes.title }}
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Detect packages to score
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          dart pub global activate melos

          CHANGED_FILES=$(git diff --name-only "$BASE...HEAD")
          if [[ "$TITLE" == chore\(release\):* ]] \
              || grep -qE '^\.github/(workflows/pana\.yml|scripts/(check_pana_report|local_pub_server)\.dart)$' <<< "$CHANGED_FILES"; then
            echo "Scoring every published package."
            PACKAGES=$(melos list --no-private --json | jq -c '[.[].name]')
          else
            PACKAGES=$(melos list --no-private --json --diff="$BASE...HEAD" --include-dependents | jq -c '[.[].name]')
          fi

          echo "Packages to score: $PACKAGES"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  pana:
    name: Pana (${{ matrix.package }})
    needs: changes
    if: ${{ needs.changes.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true

      - name: Setup Melos
        uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0

      - name: Activate pana
        run: dart pub global activate pana

      - name: Run pana
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          SERVER_LOG="$RUNNER_TEMP/local_pub_server.log"
          dart .github/scripts/local_pub_server.dart > "$SERVER_LOG" &
          for _ in $(seq 60); do
            grep -q '^Serving ' "$SERVER_LOG" && break
            sleep 1
          done
          HOSTED_URL=$(sed -n 's/^Serving //p' "$SERVER_LOG")
          if [ -z "$HOSTED_URL" ]; then
            echo "::error::The local package server did not start."
            exit 1
          fi

          cd "packages/$PACKAGE"
          pana --hosted-url "$HOSTED_URL" --json . > "$RUNNER_TEMP/pana.json"

      - name: Check the pana report
        env:
          PACKAGE: ${{ matrix.package }}
        run: dart .github/scripts/check_pana_report.dart "$PACKAGE" "$RUNNER_TEMP/pana.json"
