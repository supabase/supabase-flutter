version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      supabase-sdk-workflows:
        patterns:
          - "supabase/sdk*"
      supabase-actions-workflows:
        patterns:
          - "supabase/actions*"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "iceberg"
      - dependency-name: "postgrest"
      - dependency-name: "supabase"
      - dependency-name: "supabase_auth"
      - dependency-name: "supabase_common"
      - dependency-name: "supabase_flutter"
      - dependency-name: "supabase_flutter_web_auth"
      - dependency-name: "supabase_functions"
      - dependency-name: "supabase_lints"
      - dependency-name: "supabase_realtime"
      - dependency-name: "supabase_storage"
      - dependency-name: "supabase_test"
      - dependency-name: "supabase_typegen"
      - dependency-name: "yet_another_json_isolate"
    groups:
      pub-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
