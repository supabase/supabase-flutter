version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      # CodeQL fails unless init and analyze run the exact same version, so
      # they have to be bumped together in a single pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Every reusable workflow we call from supabase/sdk shares that
      # repository's release tags, so they always move in lockstep.
      supabase-sdk-workflows:
        patterns:
          - "supabase/sdk*"
      # Same story for the reusable workflows we call from supabase/actions,
      # which are all pinned to a single commit of that repository.
      supabase-actions-workflows:
        patterns:
          - "supabase/actions*"
      # Everything else that cannot break a workflow on its own, batched into a
      # single pull request. Major bumps deliberately match no group so they
      # still arrive individually and get reviewed on their own.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    # The packages are libraries, so a constraint only moves when the new
    # version falls outside it. Anything else only updates pubspec.lock.
    versioning-strategy: "increase-if-necessary"
    ignore:
      # The workspace packages depend on each other through path resolution
      # and are versioned by melos.
      - dependency-name: "iceberg"
      - dependency-name: "postgrest"
      - dependency-name: "supabase"
      - dependency-name: "supabase_auth"
      - dependency-name: "supabase_common"
      - dependency-name: "supabase_flutter"
      - dependency-name: "supabase_flutter_web_auth"
      - dependency-name: "supabase_functions"
      - dependency-name: "supabase_lints"
      - dependency-name: "supabase_realtime"
      - dependency-name: "supabase_storage"
      - dependency-name: "supabase_test"
      - dependency-name: "supabase_typegen"
      - dependency-name: "yet_another_json_isolate"
    groups:
      # Minor and patch releases mostly fit the existing constraints and only
      # update pubspec.lock, so they are batched into a single pull request.
      # Major bumps move a constraint and still arrive on their own.
      pub-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
