version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      # CodeQL fails unless init and analyze run the exact same version, so
      # they have to be bumped together in a single pull request.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Every reusable workflow we call from supabase/sdk shares that
      # repository's release tags, so they always move in lockstep.
      supabase-sdk-workflows:
        patterns:
          - "supabase/sdk*"
